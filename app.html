


    <!-- RoverLog: Vehicle maintenance tracking system -->
    <!-- Author: Kristopher Larson-->
    <!-- Date: 2026-11-22 -->
    <!-- Description: HTML form for adding vehicle maintenance jobs -->


    <!doctype html>
<html lang="en">

    <!-- Head section: Metadata and links to stylesheets -->

<head>
    <!-- Metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared RoverLog theme (same as the home page) -->
    <link rel="stylesheet" href="home.css">

    <!-- Link to the javascript files -->
    <script src="javascript/header.js" defer></script>   <!-- Link to the header -->
    <script src="javascript/buttons.js" defer></script>
    <script src="javascript/car.js" defer></script>   <!-- Car must load before garage.js -->
    <script src="javascript/garage.js" defer></script>
    <script src ="main.js" defer></script>   <!-- Link to the JavaScript file -->
    <title>RoverLog | My Garage</title>
</head>

    <!-- Body section: Main content of the page -->

<body>


<div class="construction-banner" role="status">
    <span class="construction-badge">Under construction</span>
    <span>RoverLog is coming soon. Launching <strong>January 2027</strong>.</span>
</div>

<div id="heading"></div> <!-- Navbar is rendered here by header.js -->

<header class="section-dark py-4 py-md-5">
    <div class="container">
        <p class="eyebrow mb-1">Your garage</p>
        <h1 class="mb-0">Manage your Rovers</h1>
    </div>
</header>

<main class="section-pad">
    <div class="container">
        <div id="roverlog" class="d-flex flex-wrap gap-2 mb-4">
            <button id="viewGarage" class="btn btn-garage">View My Garage</button>
            <button id="addCar" class="btn btn-rover">Add Car</button>
            <button id="updateRecords" class="btn btn-rover">Update Records</button>
            <button id="viewRecords" class="btn btn-rover">View Records</button>
        </div>

        <!-- Single column: one full-width column at every screen size -->
        <div class="row">
            <div class="col-12">
                <div id="newForm"></div>
            </div>
        </div>
    </div>
</main>

<footer class="py-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <img src="images/roverlog-logo.png" alt="RoverLog logo" class="rl-logo">
        <small>&copy; 2026 RoverLog</small>
    </div>
</footer>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
